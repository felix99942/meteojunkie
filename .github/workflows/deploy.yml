# Baut die Web-Version (Karte deaktiviert) und deployt sie auf GitHub Pages.
# Voraussetzung: im Repo unter Settings → Pages → Source = "GitHub Actions".
# Läuft bei jedem Push auf main/master UND stündlich (Cron), dazu zehn Termine
# passend zum Eingang der Radiosonden (s. schedule) — der Cron-Lauf
# frischt den heutigen Tag des Klimamonitors Deutschland auf (10-Minuten-Werte
# des DWD), die MOS-Vorhersage (DWD MOSMIX rechnet ~4×/Tag), die Radiosonden (DWD)
# und die Modellkarten (ECMWF 2 Läufe/Tag, ICON-EU 4, ICON-D2 8).
# Die Daten werden im Build-Schritt erzeugt (nicht versioniert) und mit deployt.
name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    # STÜNDLICH zur halben Stunde (seit 2026-10-08, vorher alle 3 h): der
    # heutige Tag des Klimamonitors Deutschland ist sonst bis zu gut 3 h alt —
    # der DWD hat kein CORS, frischer als der letzte Deploy geht es nicht. Die
    # halbe Stunde bleibt wegen ICON-D2 (alle 3 h, ~1 h 20 min nach Init
    # komplett): um 01:30, 04:30 … ist jeder Lauf zehn Minuten danach online.
    # Die Modellfelder kommen dazwischen aus dem Actions-Cache (ein Lauf wird
    # nur einmal geholt), teuer ist ein stündlicher Lauf damit nicht.
    - cron: '30 * * * *'
    # ZUSÄTZLICH auf die RADIOSONDEN gelegt (seit 2026-10-16). Grund: GitHub
    # drosselt geplante Läufe massiv — vom 14. bis 16.10. starteten von ~66
    # stündlichen Terminen nur 9, keiner abgebrochen, die übrigen gar nicht
    # ausgelöst. Ein Aufstieg erschien dadurch bis zu 6 h verspätet. Die Zeiten
    # folgen dem gemessenen Eingang beim DWD (Dateizeiten des BUFR-Verzeichnisses,
    # 15.10.): 00/12 UTC kommt 00:00–01:30 bzw. 12:00–13:30 an, Innsbruck/Graz/
    # Linz (Start 02:15) ~03–04 UTC, 06/18 UTC (Lindenberg, Idar-Oberstein,
    # Prag) 06:00–07:30 bzw. 18:00–19:30. Krumme Minuten, weil GitHub zur
    # vollen und halben Stunde am stärksten drosselt. Je Fenster ZWEI Zeilen:
    # fällt die erste aus, fängt die zweite den Termin auf. Eine GARANTIE ist
    # das nicht — verlässlich wäre nur ein externer Auslöser (workflow_dispatch).
    - cron: '7 2 * * *'
    - cron: '43 2 * * *'
    - cron: '17 4 * * *'
    - cron: '53 4 * * *'
    - cron: '47 7 * * *'
    - cron: '23 8 * * *'
    - cron: '7 14 * * *'
    - cron: '43 14 * * *'
    - cron: '47 19 * * *'
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende abbrechen, wenn neuer Push kommt.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # MOS-Vorhersage (DWD MOSMIX, DACH) frisch erzeugen → public/mos/forecast/.
      # Die JSONs sind bewusst nicht im Repo (stündlich veränderlich); der Build
      # bäckt sie ein. Ein DWD-Ausfall darf das Deployment nicht blockieren →
      # continue-on-error (dann wird der letzte deployte Stand weiter ausgeliefert
      # bzw. der Vorhersage-Tab zeigt „nicht ladbar", der Rest deployt normal).
      - name: MOS-Vorhersage erzeugen
        continue-on-error: true
        run: npm run ingest:mos:forecast

      # Klimamonitor Deutschland: DWD Climate Data Center → public/de/. Kein
      # CORS beim DWD, deshalb hier. Die HISTORISCHEN Archive (~400 MB, Monat
      # und Tag) liegen im Actions-Cache und werden nur ersetzt, wenn der DWD
      # sie neu schreibt (Dateiname mit Reihenende); neu geholt wird je Lauf
      # nur das „recent"-Fenster (~25 MB). Schlüssel je Monat: einmal im Monat
      # wird der Cache-Stand neu abgelegt.
      - name: Monat für den Klimadaten-Cache
        id: demonth
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Klimadaten Deutschland aus dem Cache
        uses: actions/cache@v4
        with:
          path: .cache/de-climate
          key: de-climate-v1-${{ steps.demonth.outputs.m }}
          restore-keys: de-climate-v1-

      - name: Klimadaten Deutschland erzeugen (DWD CDC)
        continue-on-error: true
        timeout-minutes: 20
        run: npm run ingest:de:climate

      # Modellkarten: ECMWF IFS 0,25° und DWD ICON-EU/ICON-D2 → public/nwp/,
      # Wertebilder je neuestem Lauf (zusammen ~350 MB). Python, weil das GRIB2
      # CCSDS-komprimiert ist und eccodes es dekodiert (das pip-Paket bringt
      # die Bibliothek mit).
      # Ein Ausfall darf das Deployment nicht blockieren — dann meldet die
      # Karte „nicht verfügbar", alles andere deployt normal.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-nwp.txt

      - name: Python-Pakete für die Modellkarten
        id: nwp-deps
        continue-on-error: true
        run: pip install -q -r scripts/requirements-nwp.txt

      # Gemessene Radiosondenaufstiege (DWD Open Data, GTS-Eingang als BUFR,
      # ~30 Stationen) → public/sondes/. Der DWD sendet keine CORS-Header,
      # deshalb hier statt im Browser; bis 2026-10-09 kamen die Aufstiege von
      # UWyo, das vom Runner aus stundenweise nichts lieferte. Dekodiert wird
      # je BUFR-Datei einmal: der Cache trägt die Ergebnisse von Lauf zu Lauf
      # weiter, ein Lauf dekodiert nur die Dateien seit dem letzten Stand.
      # Schlüssel je 6-STUNDEN-BLOCK, nicht je Lauf: ~8 MB stündlich abgelegt
      # wären über die 7 Tage Aufbewahrung ~1,3 GB und verdrängten im
      # 10-GB-Topf die ECMWF-Läufe; so sind es vier Einträge am Tag, und ein
      # Lauf dekodiert höchstens sechs Stunden nach. Ein Ausfall darf das
      # Deployment nicht blockieren — dann zeigt das Skew-T keine Messung.
      - name: Block für den Radiosonden-Cache
        id: sondeblock
        run: echo "b=$(date -u +%Y%m%d)-$(( $(date -u +%-H) / 6 ))" >> "$GITHUB_OUTPUT"

      - name: Radiosonden-Dekodierungen aus dem Cache
        id: sondes-cache
        if: steps.nwp-deps.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .cache/sondes
          key: sondes-bufr-v1-${{ steps.sondeblock.outputs.b }}
          restore-keys: sondes-bufr-v1-

      - name: Radiosonden übernehmen (DWD)
        id: sondes
        if: steps.nwp-deps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: python3 -u scripts/sonde-ingest.py

      - name: Radiosonden-Dekodierungen im Cache ablegen
        if: steps.sondes.outcome == 'success' && steps.sondes-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/sondes
          key: sondes-bufr-v1-${{ steps.sondeblock.outputs.b }}

      # ECMWF über den Actions-Cache JE LAUF: der Lauf wechselt nur zweimal am
      # Tag, der Cron läuft alle 3 h, und ein Lauf kostet ~7,5 min (das Netz
      # von ECMWF ist der Engpass, nicht die Rechnung). Erst die Kennung des
      # neuesten vollständigen Laufs holen (ein Abruf), dann den Cache mit
      # genau diesem Schlüssel. Wiederherstellen und Speichern GETRENNT: der
      # kombinierte Cache-Schritt speicherte am Jobende auch einen
      # halbfertigen Stand, wenn der Ingest scheitert — der Schlüssel wäre dann
      # für diesen Lauf belegt. Gespeichert wird nur bei Erfolg.
      - name: ECMWF-Lauf bestimmen
        id: ecmwf
        if: steps.nwp-deps.outcome == 'success'
        continue-on-error: true
        run: echo "run=$(python3 scripts/ecmwf-ingest.py --latest)" >> "$GITHUB_OUTPUT"

      - name: ECMWF-Felder aus dem Cache
        id: ecmwf-cache
        if: steps.ecmwf.outputs.run != ''
        uses: actions/cache/restore@v4
        with:
          path: public/nwp/ecmwf-ifs
          key: nwp-ecmwf-ifs-v6-${{ steps.ecmwf.outputs.run }}

      - name: ECMWF-Felder erzeugen (Open Data)
        id: ecmwf-ingest
        if: steps.ecmwf.outputs.run != '' && steps.ecmwf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: python3 -u scripts/ecmwf-ingest.py --run ${{ steps.ecmwf.outputs.run }}

      - name: ECMWF-Felder im Cache ablegen
        if: steps.ecmwf-ingest.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/nwp/ecmwf-ifs
          key: nwp-ecmwf-ifs-v6-${{ steps.ecmwf.outputs.run }}

      # ICON JE LAUF im Cache, seit der Cron stündlich läuft: D2 rechnet alle
      # 3 h, EU alle 6 h — ohne Cache holte jeder Lauf dieselben ~190 MB neu
      # beim DWD. Muster wie bei ECMWF: Kennung bestimmen, wiederherstellen,
      # nur bei Fehltreffer erzeugen, nur bei Erfolg ablegen.
      - name: ICON-Läufe bestimmen
        id: icon
        if: steps.nwp-deps.outcome == 'success'
        continue-on-error: true
        run: |
          echo "d2=$(python3 scripts/icon-ingest.py icon-d2 --latest)" >> "$GITHUB_OUTPUT"
          echo "eu=$(python3 scripts/icon-ingest.py icon-eu --latest)" >> "$GITHUB_OUTPUT"

      - name: ICON-D2-Felder aus dem Cache
        id: icon-d2-cache
        if: steps.icon.outputs.d2 != ''
        uses: actions/cache/restore@v4
        with:
          path: public/nwp/icon-d2
          key: nwp-icon-d2-v3-${{ steps.icon.outputs.d2 }}
          # Bei neuem Lauf den vorigen Stand als Grundlage — der Ingest legt
          # den neuen dazu, statt mit leerem Verzeichnis zu beginnen
          restore-keys: nwp-icon-d2-v3-

      - name: ICON-D2-Felder erzeugen (DWD Open Data)
        id: icon-d2-ingest
        if: steps.icon.outputs.d2 != '' && steps.icon-d2-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        # Ausdrücklich DIESER Lauf — erschiene zwischendurch ein neuerer, landete er sonst
        # unter dem Schlüssel des alten im Cache
        run: python3 -u scripts/icon-ingest.py icon-d2 --run ${{ steps.icon.outputs.d2 }}

      - name: ICON-D2-Felder im Cache ablegen
        if: steps.icon-d2-ingest.outcome == 'success' && steps.icon.outputs.d2 != ''
        uses: actions/cache/save@v4
        with:
          path: public/nwp/icon-d2
          key: nwp-icon-d2-v3-${{ steps.icon.outputs.d2 }}

      - name: ICON-EU-Felder aus dem Cache
        id: icon-eu-cache
        if: steps.icon.outputs.eu != ''
        uses: actions/cache/restore@v4
        with:
          path: public/nwp/icon-eu
          key: nwp-icon-eu-v3-${{ steps.icon.outputs.eu }}
          # Bei neuem Lauf den vorigen Stand als Grundlage — der Ingest legt
          # den neuen dazu, statt mit leerem Verzeichnis zu beginnen
          restore-keys: nwp-icon-eu-v3-

      - name: ICON-EU-Felder erzeugen (DWD Open Data)
        id: icon-eu-ingest
        if: steps.icon.outputs.eu != '' && steps.icon-eu-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        # Ausdrücklich DIESER Lauf — erschiene zwischendurch ein neuerer, landete er sonst
        # unter dem Schlüssel des alten im Cache
        run: python3 -u scripts/icon-ingest.py icon-eu --run ${{ steps.icon.outputs.eu }}

      - name: ICON-EU-Felder im Cache ablegen
        if: steps.icon-eu-ingest.outcome == 'success' && steps.icon.outputs.eu != ''
        uses: actions/cache/save@v4
        with:
          path: public/nwp/icon-eu
          key: nwp-icon-eu-v3-${{ steps.icon.outputs.eu }}

      # base-Pfad ableiten:
      #  - eigene Domain (public/CNAME vorhanden) → '/' (Domain-Wurzel)
      #  - <user>.github.io-Repo → '/'
      #  - normale Project-Pages → '/<repo>/'
      - name: Basispfad bestimmen
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ -f public/CNAME || "$REPO" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      # Impressum-Angaben kommen aus der Repository-Konfiguration, nicht aus
      # dem Quellcode: das Repository ist öffentlich, und dort soll KEINE
      # Postadresse des Anbieters stehen — auch nicht die der
      # Impressumsvertretung. Auf die ausgelieferte Seite gehört sie
      # (§ 18 Abs 1 MStV), im gebauten Bundle steht sie deshalb im Klartext.
      #
      # `vars` ODER `secrets`, mit Vorrang für `vars` — absichtlich beides:
      #
      #   * Sachlich richtig sind VARIABLES. Die Adresse wird ohnehin
      #     veröffentlicht, ist also kein Geheimnis, und Variables lassen sich
      #     im GitHub-UI ANSEHEN. Secrets sind schreib-nur: ob eines gesetzt
      #     ist und was drinsteht, sieht man nicht — genau daran ist es am
      #     2026-09-16 gescheitert, ohne dass es jemand prüfen konnte.
      #   * Der Fallback auf `secrets` bleibt, weil die beiden Reiter im UI
      #     direkt nebeneinander liegen und „Environment" noch daneben. Wer den
      #     Wert an einer der beiden Stellen einträgt, bekommt ein richtiges
      #     Impressum, statt die Ursache suchen zu müssen.
      #
      # Achtung: REPOSITORY-Ebene, nicht Environment — dieser Job hat keine
      # Environment-Bindung (nur der Deploy-Job unten hat eine).
      #
      # Fehlt ein Wert, baut die Seite trotzdem und das Impressum warnt
      # sichtbar, statt still eine Lücke zu lassen (`given()` in
      # src/config/impressum.ts behandelt LEER wie fehlend).
      # IMPRESSUM_CAREOF ist optional (Zustellzusatz einer Vertretung).
      - name: Web-Version bauen (Karte aus)
        run: npm run build:web
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
          VITE_IMPRESSUM_NAME: ${{ vars.IMPRESSUM_NAME || secrets.IMPRESSUM_NAME }}
          VITE_IMPRESSUM_CAREOF: ${{ vars.IMPRESSUM_CAREOF || secrets.IMPRESSUM_CAREOF }}
          VITE_IMPRESSUM_STREET: ${{ vars.IMPRESSUM_STREET || secrets.IMPRESSUM_STREET }}
          VITE_IMPRESSUM_CITY: ${{ vars.IMPRESSUM_CITY || secrets.IMPRESSUM_CITY }}
          VITE_IMPRESSUM_EMAIL: ${{ vars.IMPRESSUM_EMAIL || secrets.IMPRESSUM_EMAIL }}
          # Kartenkacheln Klima/MOS; fehlt der Schlüssel, bleibt der Hintergrund dunkel.
          VITE_CARTO_KEY: ${{ vars.CARTO_KEY || secrets.CARTO_KEY }}
          # Besucherzähler (GoatCounter); fehlt der Code, wird nichts geladen.
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE || secrets.GOATCOUNTER_CODE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
